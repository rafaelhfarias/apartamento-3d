scene.background = new THREE.Color(0xf4f2ee);
scene.add(new THREE.HemisphereLight(0xffffff, 0xb9b2a5, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(-6, 14, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12 });
scene.add(sun);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
const center = new THREE.Vector3(5, 0, -5);
controls.target.copy(center);

const cuttable = [];
const bytes = Uint8Array.from(atob(GLB), c => c.charCodeAt(0));
new GLTFLoader().parse(bytes.buffer, '', gltf => {
  gltf.scene.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = o.receiveShadow = true;
    if (o.material.transparent) o.material.depthWrite = false;
    if (!/^piso_/.test(o.name)) cuttable.push(o);
  });
  scene.add(gltf.scene);
  const box = new THREE.Box3().setFromObject(gltf.scene);
  box.getCenter(center); center.y = 0;
  controls.target.copy(center);
  setCut(true);
  view3d();
});

const labelObjs = LABELS.map(l => {
  const div = document.createElement('div');
  div.className = 'label';
  div.innerHTML = `${l.nome}<span>${l.dim}</span>`;
  const obj = new CSS2DObject(div);
  obj.position.set(l.x, 0.3, l.z);
  scene.add(obj);
  return obj;
});

const CUT = 1.2, FULL = 2.6;
let cut = true;
function setCut(on) {
  cut = on;
  cuttable.forEach(m => {
    if (!m.geometry.boundingBox) m.geometry.computeBoundingBox();
    const h = m.geometry.boundingBox.max.y - m.geometry.boundingBox.min.y;
    const room = (on ? CUT : FULL) - m.position.y;
    m.visible = room > 0.01;
    m.scale.y = room > 0.01 && h > room ? room / h : 1;
  });
  document.getElementById('bcut').classList.toggle('on', on);
}
function view3d() {
  camera.position.set(center.x - 7, 13, center.z + 12);
  controls.target.copy(center); controls.update();
  document.getElementById('b3d').classList.add('on'); document.getElementById('btop').classList.remove('on');
}
function viewTop() {
  camera.position.set(center.x, 22, center.z + 0.01);
  controls.target.copy(center); controls.update();
  document.getElementById('btop').classList.add('on'); document.getElementById('b3d').classList.remove('on');
}
document.getElementById('b3d').onclick = view3d;
document.getElementById('btop').onclick = viewTop;
document.getElementById('bcut').onclick = () => setCut(!cut);
document.getElementById('blbl').onclick = e => {
  const on = !e.target.classList.contains('on');
  e.target.classList.toggle('on', on);
  labelObjs.forEach(o => o.visible = on);
};

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); labelRenderer.render(scene, camera); });
</script>
</body>
</html>
